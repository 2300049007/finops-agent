version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: finops_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: finops_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: finops_backend
    restart: always
    command: sh -c "python scripts/load_policies.py && python scripts/seed_db.py && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/finops
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super_secret_finops_jwt_key_2026
      - OPENAI_API_KEY=
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: finops_celery_worker
    restart: always
    command: celery -A backend.app.tasks.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/finops
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: finops_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
